name: ingest-edgar

on:
  schedule:
    - cron: "17 11 * * 1-5" # weekdays, after the prior day's EDGAR index is published
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Ingest EDGAR distress signals
        env:
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: npm run ingest -- --days 90 --max-enrich 150
      - name: Commit updated targets
        run: |
          if git diff --quiet -- data/ingested-targets.json; then
            echo "No changes"; exit 0
          fi
          git config user.name "asset-liberator-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ingested-targets.json
          git commit -m "chore(ingest): refresh EDGAR discovered targets"
          git push
